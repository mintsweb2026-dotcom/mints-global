<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preconnect to critical origins — reduces TTFB for fonts, images, Cloudinary -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <!-- Google Fonts Non-Blocking Loading -->
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;500;600&family=Outfit:wght@400;700;900&display=swap"
      media="print"
      onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Inter:wght@400;500;600&family=Outfit:wght@400;700;900&display=swap" />
    </noscript>

    <!-- Preload Hero Image -->
    <link rel="preload" as="image" href="https://www.mintsglobal.ae/images/hero-digital-agency-dubai.webp" fetchpriority="high" />

    <!-- Canonical Tag -->
    <link rel="canonical" href="https://www.mintsglobal.ae/" />

    <!-- Default meta (overridden per-page by react-helmet-async) -->
    <title>Best Digital Marketing Agency Dubai | Mints Global</title>
    <meta name="description" content="Mints Global is Dubai's best digital marketing agency. We deliver ROI-driven marketing, software & cybersecurity solutions. Get a free consultation today!" />
    <meta name="google-site-verification" content="google92a8ddc32fa55bd3" />

    <!-- Favicon (create these files in /public) -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0d1a0f" />

    <!-- Open Graph fallback (per-page tags override these) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.mintsglobal.ae/" />
    <meta property="og:title" content="Best Digital Marketing Agency Dubai | Mints Global" />
    <meta property="og:description" content="Mints Global is Dubai's best digital marketing agency delivering ROI-driven marketing, software & cybersecurity solutions. Get a free consultation today!" />
    <meta property="og:image" content="https://www.mintsglobal.ae/images/og-mintsglobal-1200x630.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Mints Global" />

    <!-- Twitter fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mintsglobal" />
    <meta name="twitter:title" content="Best Digital Marketing Agency Dubai | Mints Global" />
    <meta name="twitter:description" content="Dubai's best digital marketing agency. ROI-driven marketing, software & cybersecurity for global brands. Book your free consultation now!" />
    <meta name="twitter:image" content="https://www.mintsglobal.ae/images/twitter-mintsglobal-1200x628.jpg" />

    <!-- Robots default -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0LVGEPW8RM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-0LVGEPW8RM');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
